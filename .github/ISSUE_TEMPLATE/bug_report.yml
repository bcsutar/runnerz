name: Bug report
description: Report a reproducible problem in Runnerz
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include health data, personal information, signing files, or private logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Runnerz, watchOS, and Xcode versions.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Apple Watch
        - watchOS Simulator
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of steps.
    validations:
      required: true
